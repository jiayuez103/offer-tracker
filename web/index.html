<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>秋招 Tracker</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'%3E%3Cpath fill='%231e1e1e' d='M1 2h14v12H1z'/%3E%3Cpath fill='%23a9d8d5' d='M2 3h12v10H2z'/%3E%3Cpath fill='%231e1e1e' d='M11 4h2v1h-2zM10 5h3v1h-3zM9 6h3v1H9zM3 7h2v1H3zM8 7h3v1H8zM3 8h3v1H3zM7 8h3v1H7zM4 9h5v1H4zM5 10h3v1H5zM6 11h1v1H6z'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/css/base.css">
</head>
<body>
  <div class="app">
    <header class="menubar">
      <a class="brand" href="#/dashboard" aria-label="offer-tracker，回到概览">
        <span class="brand-mark" data-icon="logo"></span>
        <span class="brand-name" data-pixel="offer-tracker">offer-tracker</span>
      </a>
      <h1 id="page-title" class="sr-only">概览</h1>
      <div class="menu">
        <button class="menu-item" id="new-app-btn" type="button" title="快捷键 N">新建投递</button>
        <button class="menu-item" id="invite-btn" type="button" title="粘贴测评 / 笔试 / AI 面试的邀请邮件">粘贴测评邀请</button>
      </div>
      <span class="spacer"></span>
      <label class="search">
        <span class="search-icon" data-icon="search"></span>
        <input id="global-search" type="search" placeholder="搜索" autocomplete="off">
      </label>
      <div class="clock" id="clock"></div>
    </header>
    <aside class="sidebar">
      <nav class="nav" id="nav">
        <a href="#/dashboard" data-route="dashboard"><span class="nav-icon" data-icon="home"></span><span class="nav-label">概览</span><span class="nav-badge" data-badge="dashboard"></span></a>
        <a href="#/applications" data-route="applications"><span class="nav-icon" data-icon="briefcase"></span><span class="nav-label">投递</span><span class="nav-badge" data-badge="applications"></span></a>
        <a href="#/calendar" data-route="calendar"><span class="nav-icon" data-icon="calendar"></span><span class="nav-label">日程</span></a>
        <a href="#/profile" data-route="profile"><span class="nav-icon" data-icon="user"></span><span class="nav-label">档案</span></a>
        <a href="#/resumes" data-route="resumes"><span class="nav-icon" data-icon="file"></span><span class="nav-label">简历</span></a>
        <a href="#/answers" data-route="answers"><span class="nav-icon" data-icon="book"></span><span class="nav-label">素材库</span></a>
        <a href="#/settings" data-route="settings"><span class="nav-icon" data-icon="settings"></span><span class="nav-label">设置</span></a>
      </nav>
    </aside>
    <div class="main">
      <div class="offline-banner" id="offline-banner" hidden><span data-icon="alert"></span><span>连不上 Tracker 服务：双击 <b>启动Tracker.command</b> 后刷新页面。</span></div>
      <main class="view" id="view"></main>
    </div>
  </div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
